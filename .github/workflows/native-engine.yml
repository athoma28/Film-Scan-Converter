name: Native Engine

on:
  push:
    paths:
      - ".github/workflows/native-engine.yml"
      - "native/**"
      - "LICENSE"
      - "RELEASE_NOTES.md"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/licenses/**"
      - "tests/generate_native_snapshots.py"
      - "tests/generate_raw_decode_reference.py"
  pull_request:
    paths:
      - ".github/workflows/native-engine.yml"
      - "native/**"
      - "LICENSE"
      - "RELEASE_NOTES.md"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/licenses/**"
      - "tests/generate_native_snapshots.py"
      - "tests/generate_raw_decode_reference.py"

jobs:
  pixel-equivalence:
    name: Native regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            developer_dir: /Applications/Xcode_16.2.app/Contents/Developer
          - os: macos-15
            developer_dir: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Check native formatting
        if: matrix.os == 'macos-15'
        run: >-
          swift format lint --strict --recursive
          native/FilmScanEngine/Package.swift
          native/FilmScanEngine/Sources
          native/FilmScanEngine/Tests
      - name: Install native dependencies
        run: brew install libraw
      - name: Check RAW decode compatibility boundaries
        run: bash native/test-raw-compatibility.sh
      - name: Check native numeric-field interaction
        run: |
          set -o pipefail
          swift test --package-path native/FilmScanEngine \
            --enable-code-coverage --no-parallel \
            --filter AdjustmentValueFieldInteractionTests 2>&1 | tee /tmp/fsc-native-field-ci.log
          python3 - <<'PY'
          from pathlib import Path
          if "Test run with 1 test passed" not in Path("/tmp/fsc-native-field-ci.log").read_text():
              raise SystemExit("Numeric-field test exited without a completion summary")
          PY
      - name: Run native engine regression gate
        run: |
          set -o pipefail
          swift test --package-path native/FilmScanEngine \
            --enable-code-coverage --no-parallel 2>&1 | tee /tmp/fsc-native-regression-ci.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          output = Path("/tmp/fsc-native-regression-ci.log").read_text()
          if not re.search(r"Test run with [1-9]\d* tests passed", output):
              raise SystemExit("Native regression exited without a completion summary")
          PY
      - name: Report native code coverage
        run: |
          TEST_BINARY=$(find native/FilmScanEngine/.build -path '*/debug/FilmScanEnginePackageTests.xctest/Contents/MacOS/FilmScanEnginePackageTests' -print -quit)
          COVERAGE_JSON=$(swift test --package-path native/FilmScanEngine --show-codecov-path)
          PROFILE=$(dirname "$COVERAGE_JSON")/default.profdata
          xcrun llvm-cov report "$TEST_BINARY" -instr-profile="$PROFILE" -ignore-filename-regex='Tests|\.build'
      - name: Upload native code coverage
        uses: actions/upload-artifact@v7
        with:
          name: native-code-coverage-${{ matrix.os }}
          path: native/FilmScanEngine/.build/**/codecov/*.profdata
          if-no-files-found: error
          include-hidden-files: true
      - name: Build native macOS app
        run: swift build --package-path native/FilmScanEngine --product FilmScanConverterMac
      - name: Assemble and validate unsigned beta artifact
        if: matrix.os == 'macos-15'
        run: >-
          RELEASE_MODE=unsigned-beta RELEASE_LABEL=ci
          DIST_DIR=/tmp/film-scan-converter-dist
          native/package-release.sh
